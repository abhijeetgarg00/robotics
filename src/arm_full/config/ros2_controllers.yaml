# arm_full/config/ros2_controllers.yaml
controller_manager:
  ros__parameters:
    use_sim_time: false
    update_rate: 100  # Hz

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # EITHER keep the old one…
    # panda_hand_controller:
    #   type: position_controllers/GripperActionController

    # …or use the non-deprecated one (recommended):
    panda_hand_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: false

panda_arm_controller:
  ros__parameters:
    use_sim_time: false
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    allow_nonzero_velocity_at_trajectory_end: true

panda_hand_controller:
  ros__parameters:
    use_sim_time: false
    joint: panda_finger_joint1